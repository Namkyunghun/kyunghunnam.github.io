  <text x="76" y="266" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="760" letter-spacing="-2.2">Matrix-Aware</text>
  <text x="76" y="326" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="760" letter-spacing="-2.2">Optimization</text>
  <text x="76" y="382" fill="#b9c3d4" font-family="Inter, Arial, sans-serif" font-size="23">Theory and design of Shampoo, SOAP, Muon, and beyond</text>

