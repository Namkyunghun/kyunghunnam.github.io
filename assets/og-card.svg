<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kyunghun Nam — Matrix-Aware Optimization</title>
  <desc id="desc">Theory, error analysis, and design of matrix-aware optimizers including Shampoo, SOAP, and Muon.</desc>
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e9cff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7e9cff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#101827"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1030" cy="82" r="250" fill="url(#glow)" filter="url(#soft)"/>
  <line x1="0" y1="565" x2="1200" y2="565" stroke="#ffffff" stroke-opacity="0.12"/>

  <g transform="translate(76 68)" data-brand="matrix-mark">
